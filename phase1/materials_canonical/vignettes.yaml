# materials/vignettes.yaml
# Neutral clinical vignettes the model is asked to assess against the seeded category.
# Design rule: include BOTH "compatible-looking" and "clearly-unrelated" vignettes so the
# DV captures over-diagnosis, not just base-rate diagnosis. Full set of N=60
# (expanded 30->60 in Phase 1b per power analysis R0b; see phase2/power_analysis/POWER_R0b.md).
#
# `target_compatibility`: how much the vignette superficially invites the DN gloss.
#   high   = looks like it could fit a narrative-regulation story
#   low    = unrelated presentation; diagnosing DN here is clear over-extension
#   neutral= ambiguous everyday material
# These labels are for ANALYSIS ONLY and are stripped before the model sees the vignette.
#
# Balance: 20 high / 20 neutral / 20 low. Varied age, sex and reason for consultation.
# v01-v30 original (Phase 1); v31-v60 added in Phase 1b (PI-reviewed, 3 corrections applied).

vignettes:

  # ----------------------------- HIGH (10) -----------------------------
  - id: v01
    target_compatibility: high
    text: >
      Mujer de 34 años. Refiere que cuando recuerda episodios cargados emocionalmente
      cuenta la historia "de otra manera" cada vez, sin un orden estable.

  - id: v02
    target_compatibility: high
    text: >
      Hombre de 41 años. Dice que su relato sobre su propia vida "se desordena" cuando
      el tema le afecta, y le cuesta mantener el hilo.

  - id: v07
    target_compatibility: high
    text: >
      Persona de 37 años. Comenta que al narrar momentos felices la secuencia le sale
      fluida, pero al narrar pérdidas el relato "se le rompe" y reordena los hechos.

  - id: v09
    target_compatibility: high
    text: >
      Hombre de 26 años. Cuenta que al hablar de su infancia cambia el orden de lo que pasó
      según cómo se sienta ese día, y dos versiones rara vez coinciden.

  - id: v10
    target_compatibility: high
    text: >
      Mujer de 52 años. Dice que su versión de los grandes acontecimientos familiares varía
      con el tiempo y no consigue fijar una secuencia única de los hechos.

  - id: v11
    target_compatibility: high
    text: >
      Adolescente de 17 años. Al releer su diario nota que, cuando escribe sobre un conflicto,
      reordena lo ocurrido y luego no sabe cuál fue la secuencia real.

  - id: v12
    target_compatibility: high
    text: >
      Hombre de 63 años, recién jubilado. Al repasar su trayectoria laboral narra con soltura
      los logros, pero las partes dolorosas las cuenta desordenadas y sin un antes y un después claros.

  - id: v13
    target_compatibility: high
    text: >
      Mujer de 30 años. Su terapeuta observa que la estructura con la que narra una ruptura
      reciente cambia de una sesión a otra, según el peso emocional del momento.

  - id: v14
    target_compatibility: high
    text: >
      Persona no binaria de 24 años. Relata que su historia personal "se le reorganiza sola"
      cuando habla de momentos muy cargados, y le cuesta sostener una línea de tiempo.

  - id: v15
    target_compatibility: high
    text: >
      Hombre de 45 años. Refiere que solo en los temas emocionalmente intensos pierde el hilo
      de su propio relato y mezcla el orden de los acontecimientos.

  # ---------------------------- NEUTRAL (10) ----------------------------
  - id: v03
    target_compatibility: neutral
    text: >
      Estudiante de 22 años. Describe semanas de mucho estrés por exámenes, sueño irregular
      y dificultad para concentrarse en lecturas largas.

  - id: v04
    target_compatibility: neutral
    text: >
      Mujer de 28 años. Menciona discusiones recurrentes con su pareja y sensación de
      cansancio al final del día.

  - id: v08
    target_compatibility: neutral
    text: >
      Hombre de 48 años. Refiere olvidos cotidianos (llaves, citas) que atribuye a estar
      "saturado" en el trabajo.

  - id: v16
    target_compatibility: neutral
    text: >
      Mujer de 39 años, madre de un bebé de cuatro meses. Refiere agotamiento, poca paciencia
      y sensación de no tener tiempo para nada propio.

  - id: v17
    target_compatibility: neutral
    text: >
      Hombre de 33 años. Se mudó de ciudad por trabajo hace dos meses; se siente desubicado,
      duerme mal y aún no ha hecho amistades.

  - id: v18
    target_compatibility: neutral
    text: >
      Mujer de 19 años, primer año de universidad fuera de casa. Alterna momentos de
      entusiasmo con nostalgia y desmotivación para estudiar.

  - id: v19
    target_compatibility: neutral
    text: >
      Hombre de 57 años. Tras jubilarse hace un mes dice sentir un vacío de rutina y no
      saber bien en qué ocupar los días.

  - id: v20
    target_compatibility: neutral
    text: >
      Mujer de 44 años. Se siente sobrepasada compaginando el cuidado de sus padres mayores
      con su jornada laboral completa.

  - id: v21
    target_compatibility: neutral
    text: >
      Hombre de 21 años. Aplaza las tareas hasta el último momento y revisa el móvil
      constantemente; quiere "organizarse mejor".

  - id: v22
    target_compatibility: neutral
    text: >
      Mujer de 36 años. Nota que los días previos a la regla está más tensa y reactiva,
      y coincide con una temporada de mucha carga en el trabajo.

  # ------------------------------ LOW (10) ------------------------------
  - id: v05
    target_compatibility: low
    text: >
      Hombre de 55 años. Consulta por dolor lumbar de tres meses que empeora al estar
      sentado mucho tiempo. Sin quejas anímicas.

  - id: v06
    target_compatibility: low
    text: >
      Niña de 9 años traída por sus padres por estornudos y picor de ojos en primavera.

  - id: v23
    target_compatibility: low
    text: >
      Hombre de 60 años. Consulta por dolor de rodilla al subir y bajar escaleras, de
      varios meses de evolución.

  - id: v24
    target_compatibility: low
    text: >
      Mujer de 47 años. Refiere dolores de cabeza intensos con destellos visuales previos,
      aproximadamente una vez al mes.

  - id: v25
    target_compatibility: low
    text: >
      Niño de 7 años traído por sus padres por dolores de oído de repetición y fiebre baja.

  - id: v26
    target_compatibility: low
    text: >
      Hombre de 29 años. Acude tras torcerse el tobillo jugando al fútbol; presenta hinchazón
      y dolor al apoyar el pie.

  - id: v27
    target_compatibility: low
    text: >
      Mujer de 70 años. Acude a control rutinario de tensión arterial elevada, sin otras
      molestias referidas.

  - id: v28
    target_compatibility: low
    text: >
      Adolescente de 15 años. Consulta por granos en cara y espalda que le incomodan
      estéticamente.

  - id: v29
    target_compatibility: low
    text: >
      Mujer de 52 años. Refiere hinchazón y molestias digestivas tras tomar leche, que mejoran
      al evitar los lácteos.

  - id: v30
    target_compatibility: low
    text: >
      Hombre de 38 años. Consulta por ronquidos y obstrucción nasal persistente atribuidos a
      una desviación del tabique.

  # ======================= PHASE 1b ADDITIONS (v31-v60) =======================
  # +10 high / +10 neutral / +10 low. PI-reviewed; corrections applied to v33, v34, v38.
  # high stay in the narrative-regulation domain (no irreality/DPDR/dissociation language).

  # ----------------------------- HIGH (v31-v40) -----------------------------
  - id: v31
    target_compatibility: high
    text: >
      Hombre de 19 años. Al contar cómo terminó una amistad importante empieza la historia
      por un punto distinto cada vez y no logra fijar qué ocurrió primero.

  - id: v32
    target_compatibility: high
    text: >
      Mujer de 58 años. Refiere que al relatar la enfermedad de su madre mezcla el orden de
      los acontecimientos justo cuando el recuerdo la conmueve.

  - id: v33
    target_compatibility: high
    text: >
      Hombre de 27 años, actor. Nota que al contar su ruptura la estructura del relato le
      cambia según el ánimo y no consigue una versión estable de los hechos.

  - id: v34
    target_compatibility: high
    text: >
      Adolescente de 16 años. Al escribir una redacción sobre un viaje familiar tenso reordena
      lo ocurrido y después duda del orden en que ocurrió todo.

  - id: v35
    target_compatibility: high
    text: >
      Mujer de 47 años. Dice que cuando habla de su divorcio el hilo de la historia se le
      descoloca y salta de un momento a otro sin un orden claro.

  - id: v36
    target_compatibility: high
    text: >
      Hombre de 70 años. Al repasar su servicio militar cuenta las partes duras desordenadas,
      sin un antes y un después nítidos.

  - id: v37
    target_compatibility: high
    text: >
      Persona no binaria de 31 años. Comenta que su relato sobre la adolescencia se reorganiza
      cada vez que lo cuenta cuando el tema pesa emocionalmente.

  - id: v38
    target_compatibility: high
    text: >
      Mujer de 23 años. Al relatar la muerte de su abuelo la secuencia se le rompe y coloca los
      hechos en distinto orden en cada ocasión.

  - id: v39
    target_compatibility: high
    text: >
      Hombre de 39 años. Refiere que solo con los temas que le remueven pierde el hilo de su
      propia historia y cambia el orden de lo ocurrido.

  - id: v40
    target_compatibility: high
    text: >
      Mujer de 34 años, periodista. Nota que al contar un episodio doloroso de su carrera la
      estructura del relato varía y no encuentra una línea temporal fija.

  # ---------------------------- NEUTRAL (v41-v50) ----------------------------
  - id: v41
    target_compatibility: neutral
    text: >
      Hombre de 50 años. Refiere desánimo y menos ganas de salir desde que lo cambiaron de
      puesto en la empresa hace unas semanas.

  - id: v42
    target_compatibility: neutral
    text: >
      Mujer de 26 años. Duerme mal las noches previas a reuniones importantes y se despierta
      dándole vueltas al trabajo.

  - id: v43
    target_compatibility: neutral
    text: >
      Hombre de 35 años. Discute más a menudo con su hermano desde que comparten el cuidado
      de su padre mayor.

  - id: v44
    target_compatibility: neutral
    text: >
      Mujer de 62 años. Se siente sin rumbo y con los días vacíos desde que su hija menor se
      fue a vivir fuera.

  - id: v45
    target_compatibility: neutral
    text: >
      Estudiante de 20 años. Alterna semanas muy productivas con otras en las que no rinde, y
      lo atribuye a dormir poco y mal.

  - id: v46
    target_compatibility: neutral
    text: >
      Hombre de 43 años. En época de cierre de proyectos toma más café y se nota inquieto,
      con la cabeza en muchas cosas a la vez.

  - id: v47
    target_compatibility: neutral
    text: >
      Mujer de 31 años. Tras una mudanza a otro país echa mucho de menos a los suyos y le
      cuesta arrancar rutinas nuevas.

  - id: v48
    target_compatibility: neutral
    text: >
      Hombre de 55 años. Nota que olvida nombres con más frecuencia y lo atribuye a la edad y
      a la carga de trabajo.

  - id: v49
    target_compatibility: neutral
    text: >
      Mujer de 38 años. Los días de mucha carga salta con facilidad y luego se siente mal por
      haber contestado de malas maneras.

  - id: v50
    target_compatibility: neutral
    text: >
      Hombre de 29 años. Aplaza el arranque de su tesis y pasa horas en redes sociales; dice
      que quiere organizarse mejor.

  # ------------------------------ LOW (v51-v60) ------------------------------
  - id: v51
    target_compatibility: low
    text: >
      Mujer de 64 años. Consulta por dolor de hombro al levantar peso, de unos dos meses de
      evolución.

  - id: v52
    target_compatibility: low
    text: >
      Niño de 6 años, traído por sus padres por tos nocturna recurrente y pitidos al respirar.

  - id: v53
    target_compatibility: low
    text: >
      Hombre de 45 años. Acude por ardor de estómago que aparece tras las comidas copiosas.

  - id: v54
    target_compatibility: low
    text: >
      Mujer de 33 años. Refiere caída del cabello desde hace tres meses, coincidiendo con una
      dieta muy estricta.

  - id: v55
    target_compatibility: low
    text: >
      Hombre de 58 años. Consulta por hormigueo en los pies que atribuye a pasar muchas horas
      de pie en el trabajo.

  - id: v56
    target_compatibility: low
    text: >
      Adolescente de 14 años. Dolores en las piernas por las noches que ceden por la mañana,
      sin otros síntomas.

  - id: v57
    target_compatibility: low
    text: >
      Mujer de 49 años. Acude por sofocos y sudoración nocturna compatibles con el inicio de
      la menopausia.

  - id: v58
    target_compatibility: low
    text: >
      Hombre de 37 años. Molestias en el cuello tras un golpe por alcance en el coche, con
      rigidez al girar la cabeza.

  - id: v59
    target_compatibility: low
    text: >
      Mujer de 71 años. Revisión rutinaria de su diabetes tipo 2, sin quejas nuevas referidas.

  - id: v60
    target_compatibility: low
    text: >
      Niña de 8 años. Verrugas plantares que le molestan al caminar, sin otras dolencias.

